quarkus.application.name=review
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=none

mp.jwt.verify.publickey.location=${JWKS_URL}
mp.jwt.verify.issuer=auth

quarkus.rest-client.restaurant.url=http://restaurant:8080
quarkus.rest-client.restaurant.connect-timeout=2000
quarkus.rest-client.restaurant.read-timeout=5000
quarkus.rest-client.user.url=http://user:8080
quarkus.rest-client.user.connect-timeout=2000
quarkus.rest-client.user.read-timeout=5000
org.eclipse.microprofile.rest.client.propagateHeaders=Authorization

quarkus.application.name=courier-profile
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.telemetry=true
quarkus.hibernate-orm.schema-management.strategy=none

mp.jwt.verify.publickey.location=${JWKS_URL}
mp.jwt.verify.issuer=auth

quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/health:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/health"
        - attributes["url.path"] == "/health"
        - IsMatch(name, "^GET /health http ")
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  file:
    path: /traces/traces.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/health, batch]
      exporters: [otlp/jaeger, file]

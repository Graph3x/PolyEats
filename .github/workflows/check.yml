name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: ruff check

      - run: ruff format --check

      - run: pytest infra/tools

      - run: python infra/tools/canonicalise.py --check dataset/connections.json

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, gateway, geocoding]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: services/${{ matrix.service }}

  java:
    runs-on: ubuntu-latest
    env:
      GJF_VERSION: 2.0.0
      PMD_VERSION: 7.29.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - run: git ls-files 'services/*.java' > "$RUNNER_TEMP/java-files"

      - run: |
          curl -fsSLo "$RUNNER_TEMP/gjf.jar" "https://github.com/google/google-java-format/releases/download/v$GJF_VERSION/google-java-format-$GJF_VERSION-all-deps.jar"
          java -jar "$RUNNER_TEMP/gjf.jar" --aosp --dry-run --set-exit-if-changed @"$RUNNER_TEMP/java-files"

      - run: |
          curl -fsSLo "$RUNNER_TEMP/pmd.zip" "https://github.com/pmd/pmd/releases/download/pmd_releases%2F$PMD_VERSION/pmd-dist-$PMD_VERSION-bin.zip"
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/pmd-bin-$PMD_VERSION/bin/pmd" check -R pmd.xml --file-list "$RUNNER_TEMP/java-files" --no-progress

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: ruff check

      - run: ruff format --check

      - run: pytest infra/tools

      - run: python infra/tools/canonicalise.py --check dataset/connections.json

name: polyeats

networks:
  polyeats:

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  polyeats-init:
    image: busybox:1.37
    command: ["chmod", "777", "/traces"]
    volumes:
      - ./traces:/traces

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./traces:/traces
    depends_on:
      polyeats-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - polyeats

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI
    networks:
      - polyeats

  geocoding:
    build: ./services/geocoding
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: geocoding
      GEO_DB_PATH: /data/geo.db
    ports:
      - "8000:8080" # REST
      - "9000:9090" # gRPC
    networks:
      - polyeats

  order-tracking:
    build: ./services/order-tracking
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: order-tracking
      GEOCODING_ADDR: geocoding:9090
    ports:
      - "8001:8080" # REST
    networks:
      - polyeats

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: address
      POSTGRES_USER: polyeats
      POSTGRES_PASSWORD: polyeats
    volumes:
      - ./services/address/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyeats -d address"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - polyeats

  address:
    build: ./services/address
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: address
      POSTGRES_URL: jdbc:postgresql://postgres:5432/address
      POSTGRES_USER: polyeats
      POSTGRES_PASSWORD: polyeats
    ports:
      - "8002:8080" # REST
    networks:
      - polyeats

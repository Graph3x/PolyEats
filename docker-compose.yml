name: polyeats

networks:
  polyeats:

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

x-jwks: &jwks
  JWKS_URL: http://auth:8080/.well-known/jwks.json

x-healthcheck: &healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 60s
  start_interval: 3s


services:
  polyeats-init:
    image: busybox:1.37
    command: ["chmod", "777", "/traces"]
    volumes:
      - ./traces:/traces

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./traces:/traces
    depends_on:
      polyeats-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - polyeats

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI
    networks:
      - polyeats

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: polyeats
      POSTGRES_PASSWORD: polyeats
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./services/address/db/schema.sql:/schemas/address.sql:ro
      - ./services/user/db/schema.sql:/schemas/user.sql:ro
      - ./services/restaurant/db/schema.sql:/schemas/restaurant.sql:ro
      - ./services/account/db/schema.sql:/schemas/account.sql:ro
      - ./services/courier-profile/db/schema.sql:/schemas/courier-profile.sql:ro
      - ./services/review/db/schema.sql:/schemas/review.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U polyeats"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - polyeats

  gateway:
    build: ./services/gateway
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: gateway
      AUTH_ADDR: auth:9090
    ports:
      - "8004:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  geocoding:
    build: ./services/geocoding
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: geocoding
      GEO_DB_PATH: /data/geo.db
    ports:
      - "8000:8080" # REST
      - "9000:9090" # gRPC
    healthcheck: *healthcheck
    networks:
      - polyeats

  order-tracking:
    build: ./services/order-tracking
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: order-tracking
      GEOCODING_ADDR: geocoding:9090
    ports:
      - "8001:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  address:
    build: ./services/address
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: address
      POSTGRES_URL: jdbc:postgresql://postgres:5432/address
      POSTGRES_USER: address
      POSTGRES_PASSWORD: address
    ports:
      - "8002:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  user:
    build: ./services/user
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: user
      POSTGRES_URL: jdbc:postgresql://postgres:5432/user
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "8005:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  restaurant:
    build: ./services/restaurant
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: restaurant
      POSTGRES_URL: jdbc:postgresql://postgres:5432/restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "8006:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  account:
    build: ./services/account
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: account
      POSTGRES_URL: jdbc:postgresql://postgres:5432/account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "8007:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  courier-profile:
    build: ./services/courier-profile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: courier-profile
      POSTGRES_URL: jdbc:postgresql://postgres:5432/courier-profile
      POSTGRES_USER: courier-profile
      POSTGRES_PASSWORD: courier-profile
    ports:
      - "8008:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  review:
    build: ./services/review
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*otel, *jwks]
      OTEL_SERVICE_NAME: review
      POSTGRES_URL: jdbc:postgresql://postgres:5432/review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
    ports:
      - "8009:8080" # REST
    healthcheck: *healthcheck
    networks:
      - polyeats

  auth-valkey:
    image: valkey/valkey:9.1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - polyeats

  auth:
    build: ./services/auth
    depends_on:
      auth-valkey:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: auth
      VALKEY_ADDR: auth-valkey:6379
      ACCOUNT_URL: http://account:8080
      JWT_KEY_PATH: /keys/dev.pem
    volumes:
      - ./services/auth/keys/dev.pem:/keys/dev.pem:ro
    ports:
      - "8003:8080" # REST
      - "9003:9090" # gRPC
    healthcheck: *healthcheck
    networks:
      - polyeats

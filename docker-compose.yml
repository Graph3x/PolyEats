name: polyeats

networks:
  polyeats:

services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - polyeats

  geocoding:
    build: ./services/geocoding
    ports:
      - "8080:8080" # REST
      - "9090:9090" # gRPC
    networks:
      - polyeats
